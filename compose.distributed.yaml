# ==============================================================================
# SyncShift Distributed Multi-Instance Architecture with Load Balancer
# ==============================================================================
# Topology:
#                      Nginx Load Balancer (:8000)
#                      /          |          \
#               backend-1     backend-2     backend-3
#               (:8001)       (:8002)       (:8003)
#                      \          |          /
#                         Redis Service (:6379)
# ==============================================================================

services:
  # Shared Redis Instance for Distributed Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: syncshift-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - syncshift-cluster
    volumes:
      - redis_cluster_data:/data

  # Backend Instance 1
  backend-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syncshift-backend-1
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      ENV: development
      DATABASE_URL: sqlite:////data/syncshift.db
      REDIS_URL: redis://redis:6379/0
      TRUSTED_PROXIES: 127.0.0.1,::1,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,testclient,loadbalancer
      JWT_SECRET: ${JWT_SECRET:-syncshift-dev-secret-key-32-chars-minimum!!}
      SECRET_KEY: ${SECRET_KEY:-syncshift-dev-secret-key-32-chars-minimum!!}
      ALLOWED_ORIGINS: "*"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - sqlite_cluster_data:/data
    networks:
      - syncshift-cluster
    restart: unless-stopped

  # Backend Instance 2
  backend-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syncshift-backend-2
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      ENV: development
      DATABASE_URL: sqlite:////data/syncshift.db
      REDIS_URL: redis://redis:6379/0
      TRUSTED_PROXIES: 127.0.0.1,::1,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,testclient,loadbalancer
      JWT_SECRET: ${JWT_SECRET:-syncshift-dev-secret-key-32-chars-minimum!!}
      SECRET_KEY: ${SECRET_KEY:-syncshift-dev-secret-key-32-chars-minimum!!}
      ALLOWED_ORIGINS: "*"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - sqlite_cluster_data:/data
    networks:
      - syncshift-cluster
    restart: unless-stopped

  # Backend Instance 3
  backend-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syncshift-backend-3
    ports:
      - "127.0.0.1:8003:8000"
    environment:
      ENV: development
      DATABASE_URL: sqlite:////data/syncshift.db
      REDIS_URL: redis://redis:6379/0
      TRUSTED_PROXIES: 127.0.0.1,::1,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,testclient,loadbalancer
      JWT_SECRET: ${JWT_SECRET:-syncshift-dev-secret-key-32-chars-minimum!!}
      SECRET_KEY: ${SECRET_KEY:-syncshift-dev-secret-key-32-chars-minimum!!}
      ALLOWED_ORIGINS: "*"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - sqlite_cluster_data:/data
    networks:
      - syncshift-cluster
    restart: unless-stopped

  # Nginx Round-Robin Load Balancer
  loadbalancer:
    image: nginx:alpine
    container_name: syncshift-loadbalancer
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    networks:
      - syncshift-cluster
    restart: unless-stopped

networks:
  syncshift-cluster:
    driver: bridge

volumes:
  sqlite_cluster_data:
  redis_cluster_data:
