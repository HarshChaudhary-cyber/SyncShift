services:
  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: syncshift-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      NEXT_PUBLIC_MICROSOFT_CLIENT_ID: ${NEXT_PUBLIC_MICROSOFT_CLIENT_ID:-}
      NEXT_PUBLIC_MICROSOFT_REDIRECT_URI: ${NEXT_PUBLIC_MICROSOFT_REDIRECT_URI:-http://localhost:3000/auth/microsoft/callback}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syncshift-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ENV: development
      DATABASE_URL: sqlite:////data/syncshift.db
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,::1,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,testclient}
      JWT_SECRET: ${JWT_SECRET:-syncshift-dev-secret-key-32-chars-minimum!!}
      SECRET_KEY: ${SECRET_KEY:-syncshift-dev-secret-key-32-chars-minimum!!}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      # Local email-login testing works without external CAPTCHA configuration.
      # Set both provider keys and CAPTCHA_ENFORCE=true when enabling Turnstile.
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
      CAPTCHA_ENFORCE: ${CAPTCHA_ENFORCE:-false}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - sqlite_data:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: syncshift-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  sqlite_data:
  redis_data:
